name: CI - Share Trips

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write

env:
  MAILER_FROM: "noreply@sharetrips.fr"
  MAILER_FROM_NAME: "ShareTrips"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint Twig
        run: php bin/console lint:twig ./templates
      - name: Lint Yaml
        run: php bin/console lint:yaml ./config --parse-tags
      - name: Lint Container
        run: php bin/console lint:container
      - name: PHPCS
        run: vendor/bin/phpcs
      - name: PHPStan
        run: vendor/bin/phpstan analyse

  unit-test:
    name: PHPUnit Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: PHPUnit - unit
        run: vendor/bin/phpunit
