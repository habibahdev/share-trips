services:
  postgres:
    image: postgres:15-alpine
    container_name: sharetrip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharetrips
      POSTGRES_USER: tripsadmin
      POSTGRES_PASSWORD: tripsadmin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripsadmin -d tripsadmin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sharetrips_network

  adminer:
    image: adminer:latest
    container_name: sharetrips_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - sharetrips_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharetrips_app
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://tripsadmin:tripsadmin@postgres:5432/sharetrips?serverVersion=15&charset=utf8
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sharetrips_network

volumes:
  postgres_data:
    driver: local

networks:
  sharetrips_network:
    driver: bridge