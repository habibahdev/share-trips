services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sharetrips_app_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html/share-trips
    environment:
      APP_ENV: dev
      APP_SECRET: changeme
      DATABASE_URL: "postgresql://tripsadmin:tripsadmin@postgres:5432/sharetrips?serverVersion=15&charset=utf8"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: sharetrips_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: sharetrips
      POSTGRES_USER: tripsadmin
      POSTGRES_PASSWORD: tripsadmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripsadmin -d sharetrips"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: